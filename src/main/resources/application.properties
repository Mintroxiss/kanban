spring.application.name=kanban

jwt.secret=NTJmMjk5OTQ1M2U2MDAyYmIwNTk2MzUyODhiMmJiZTNjMDdjNTgyMDA1Mjg4MzAwZDdhOTgwYjI1ODJhMjFmNg==

spring.datasource.url=jdbc:postgresql://db:5432/kanban
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.flywaydb.core=WARN
logging.level.org.springframework.orm.jpa=WARN
